# 温泉剧本仓（onsen / scenarioId 12）
#
# 独立仓：以 path 依赖引用引擎仓 umaai-next 的稳定面；稳定期换 git tag。
# 依赖三档（详见引擎仓 docs/scenario/README.md）：
#   1. 开发期：并列目录 path（当前写法，引擎仓与本仓并列）
#   2. 稳定期：git + tag（同一 repo、同一 tag）
#   3. 下游（Web / Android）：default-features = false（剪掉并行后端与文件监听）
[package]
name = "umaai-onsen"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# 引擎稳定面：剧本只依赖这三个（外加终端样例面的 umaai-cli）
umaai-core = { path = "../umaai_next/crates/umaai-core" }
umasim = { path = "../umaai_next/crates/umasim" }
umaai = { path = "../umaai_next/crates/umaai" }
# 终端样例外壳用：复用呈现件（pub 面不承诺稳定）；Web / Android 宿主自实现 Frontend，可去掉
umaai-cli = { path = "../umaai_next/crates/umaai-cli" }

anyhow = "1.0.104"
rand = { version = "0.9.5", features = ["std_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"

# 本仓自带 workspace 根（独立仓）；并入别的 workspace 时删掉本表并登记 members
[workspace]
