# 温泉剧本仓（onsen / scenarioId 12）workspace 根
#
# 独立仓：以 path 依赖引用引擎仓 umaai-next 的稳定面；稳定期换 git tag。
# 依赖三档（详见引擎仓 docs/scenario/README.md）：
#   1. 开发期：并列目录 path（当前写法，引擎仓与本仓并列）
#   2. 稳定期：git + tag（同一 repo、同一 tag）
#   3. 下游（Web / Android）：default-features = false（剪掉并行后端与文件监听）
#
# 成员按**终端业务形态**划分（2026-10-24 拍板）：
#   onsen-core 机制本体 + 训练员 + 装配（宿主稳定面）；onsen-sim 模拟器；
#   onsen-ai 在线决策核心（M2）；onsen-cli 终端前端；onsen-tools 外围工具（测卡 / 复盘）。
[workspace]
resolver = "3"
members = [
    "crates/onsen-core",
    "crates/onsen-sim",
    "crates/onsen-ai",
    "crates/onsen-cli",
    "crates/onsen-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# 引擎稳定面（onsen-core 只依赖前三个；终端样例面另引 umaai-cli）
umaai-core = { path = "../umaai_next/crates/umaai-core" }
umasim = { path = "../umaai_next/crates/umasim" }
umaai = { path = "../umaai_next/crates/umaai" }
umaai-cli = { path = "../umaai_next/crates/umaai-cli" }

# 本仓内部 crate（有消费者时再登记下一个）
onsen-core = { path = "crates/onsen-core" }

anyhow = "1.0.104"
rand = { version = "0.9.5", features = ["std_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
# 手动训练员的终端交互件（仅 onsen-cli 用）
inquire = "0.9.4"
